<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Lady — Play Ludo Online with Friends</title>
  <meta name="description" content="Play Ludo Lady with family and friends online peer-to-peer! No signup needed.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- LOBBY SCREEN -->
    <div id="lobby-screen" class="screen active">
      <div class="lobby-container">
        <div class="logo">
          <h1>🎲 Ludo Lady</h1>
          <p class="tagline">Play Ludo with family & friends — no signup needed!</p>
        </div>
        
        <div class="lobby-card glass-card">
          <div class="form-group">
            <label for="player-name">Your Name</label>
            <input type="text" id="player-name" placeholder="Enter your name..." maxlength="20" autocomplete="off">
          </div>
          
          <div class="form-group">
            <label>Number of Players</label>
            <div class="player-count-selector" id="player-count-selector">
              <button class="count-btn" data-count="2">2</button>
              <button class="count-btn active" data-count="3">3</button>
              <button class="count-btn" data-count="4">4</button>
            </div>
          </div>
          <button id="create-room-btn" class="btn btn-primary">🏠 Create Room</button>
          
          <div class="divider"><span>OR JOIN A FRIEND</span></div>
          
          <div class="form-group">
            <label for="room-code-input">Room Code</label>
            <input type="text" id="room-code-input" placeholder="e.g. LUDO-AB12CD" maxlength="11" autocomplete="off" style="text-transform:uppercase">
          </div>
          <button id="join-room-btn" class="btn btn-secondary">🚪 Join Room</button>
        </div>
        
        <p class="footer-note">No server needed — plays peer-to-peer in your browser!</p>
      </div>
    </div>
    
    <!-- WAITING ROOM SCREEN -->
    <div id="waiting-screen" class="screen">
      <div class="waiting-container">
        <div class="glass-card waiting-card">
          <h2>Room: <span id="room-code-display" class="room-code"></span></h2>
          <p class="room-link-label">Share this link with friends:</p>
          <div class="share-link-box">
            <input type="text" id="share-link" readonly>
            <button id="copy-link-btn" class="btn btn-icon" title="Copy link">📋</button>
          </div>
          <div class="players-list" id="players-list"></div>
          <p id="waiting-status" class="waiting-status">Waiting for players to join...</p>
          <button id="start-game-btn" class="btn btn-primary" style="display:none">🎮 Start Game</button>
          <button id="back-to-lobby-btn" class="btn btn-secondary btn-small">← Back to Lobby</button>
        </div>
      </div>
    </div>
    
    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen">
      <div class="game-layout">
        <!-- Left Panel: Player Info -->
        <div class="side-panel left-panel" id="left-panel">
          <div class="game-title-small">🎲 Ludo Lady</div>
          <div class="player-cards-container" id="player-cards"></div>
        </div>
        
        <!-- Center: Board -->
        <div class="board-container" id="board-container">
          <div class="board-wrapper">
            <canvas id="game-canvas"></canvas>
          </div>
        </div>
        
        <!-- Right Panel: Controls -->
        <div class="side-panel right-panel" id="right-panel">
          <div class="dice-section">
            <div class="dice-container" id="dice-container">
              <div class="dice-3d" id="dice-3d">
                <div class="dice-face front"></div>
                <div class="dice-face back"></div>
                <div class="dice-face right"></div>
                <div class="dice-face left"></div>
                <div class="dice-face top"></div>
                <div class="dice-face bottom"></div>
              </div>
            </div>
            <button id="roll-dice-btn" class="btn btn-dice" disabled>🎲 Roll Dice</button>
          </div>
          <div class="turn-indicator" id="turn-indicator">Waiting to start...</div>
          <div class="game-log-container">
            <h3 class="log-title">Game Log</h3>
            <div class="game-log" id="game-log"></div>
          </div>
          <button id="sound-toggle-btn" class="btn btn-icon sound-btn" title="Toggle sound">🔊</button>
        </div>
      </div>
    </div>
    
    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>
    
    <!-- Winner Overlay -->
    <div id="winner-overlay" class="winner-overlay hidden">
      <div class="winner-content glass-card">
        <div class="winner-emoji">🏆</div>
        <h2 id="winner-text">Winner!</h2>
        <p id="winner-subtitle">has won the game!</p>
        <div id="confetti" class="confetti-container"></div>
        <button id="play-again-btn" class="btn btn-primary">🔄 Play Again</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/constants.js"></script>
  <script src="js/gameLogic.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/network.js"></script>
  <script src="js/board.js"></script>
  <script src="js/token.js"></script>
  <script src="js/dice.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
