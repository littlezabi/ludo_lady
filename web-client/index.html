<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ludo Lady 3D - Online Multiplayer & Local Board Game</title>
  <style>
    :root {
      --bg-dark: #090d16;
      --panel-bg: rgba(30, 41, 59, 0.88);
      --card-bg: rgba(15, 23, 42, 0.75);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --accent-pink: #ec4899;
      --accent-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: fixed;
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      background: #090d16;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--border-color);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Fullscreen Main Menu Overlay */
    #main-menu-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 1.5rem;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #main-menu-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .menu-card {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-color);
      border-radius: 1.5rem;
      padding: 2.5rem;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(56, 189, 248, 0.15);
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      position: relative;
      overflow: hidden;
    }

    .menu-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #38bdf8, #ec4899, #eab308, #22c55e);
    }

    .menu-header {
      text-align: center;
    }

    .menu-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
    }

    .menu-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    /* Menu Tabs */
    .menu-tabs {
      display: flex;
      background: rgba(30, 41, 59, 0.7);
      padding: 0.35rem;
      border-radius: 0.85rem;
      gap: 0.35rem;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 0.65rem 0.5rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 0.6rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0f172a;
      box-shadow: 0 4px 12px var(--accent-glow);
    }

    /* Tab Content Panels */
    .tab-content {
      display: none;
      flex-direction: column;
      gap: 1.25rem;
    }

    .tab-content.active {
      display: flex;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    select, input[type="text"] {
      background: #0f172a;
      color: white;
      border: 1.5px solid var(--border-color);
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 1rem;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .code-display-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #090d16;
      border: 2px dashed var(--accent);
      padding: 0.85rem 1.2rem;
      border-radius: 0.85rem;
    }

    .code-text {
      font-family: monospace;
      font-size: 1.4rem;
      font-weight: 900;
      letter-spacing: 0.25em;
      color: var(--accent);
    }

    .btn-copy {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 0.4rem 0.85rem;
      border-radius: 0.5rem;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-copy:hover {
      background: var(--accent);
      color: #0f172a;
    }

    .btn-primary-action {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0f172a;
      border: none;
      padding: 0.9rem 1.5rem;
      border-radius: 0.85rem;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      min-height: 48px;
    }

    .btn-primary-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px var(--accent-glow);
    }

    .btn-primary-action:active {
      transform: translateY(0);
    }

    .btn-secondary-action {
      background: rgba(255, 255, 255, 0.08);
      color: white;
      border: 1px solid var(--border-color);
      padding: 0.75rem 1.25rem;
      border-radius: 0.85rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-secondary-action:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* In-Game Header */
    header {
      padding: 0.75rem 1.25rem;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .logo {
      font-size: 1.15rem;
      font-weight: 800;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
    }

    .turn-badge {
      padding: 0.35rem 0.85rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.825rem;
      border: 1.5px solid currentColor;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .room-info-pill {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .room-panel {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      touch-action: none;
    }

    #canvas-container canvas {
      width: 100% !important;
      height: 100% !important;
      touch-action: none;
    }

    .control-bar {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 1.25rem;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      z-index: 100;
      max-width: 95vw;
    }

    .dice-box {
      width: 48px;
      height: 48px;
      background: #1e293b;
      border: 2px solid var(--accent);
      border-radius: 0.75rem;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
      flex-shrink: 0;
    }

    .btn-roll {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #0f172a;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.85rem;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      white-space: nowrap;
      min-height: 44px;
      min-width: 120px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn-roll:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.4);
    }

    .btn-roll:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-roll:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .action-log {
      font-size: 0.85rem;
      color: var(--text-muted);
      max-width: 180px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(12px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
    }

    .modal-card {
      background: #1e293b;
      border: 1px solid var(--border-color);
      padding: 2rem;
      border-radius: 1.25rem;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      max-width: 90vw;
    }

    .modal-card h2 {
      font-size: 1.75rem;
      margin-bottom: 1.25rem;
      color: #38bdf8;
    }

    /* Floating Multi-Piece Stack Color Dots Indicator */
    #stack-overlay-container {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 150;
      overflow: hidden;
    }

    .stack-dot-row {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 4px 8px;
      background: rgba(15, 23, 42, 0.88);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 9999px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.85), 0 0 10px rgba(0, 0, 0, 0.6);
      transform: translate(-50%, -100%);
      pointer-events: none;
      transition: opacity 0.15s ease;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .stack-dot-row::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px 4.5px 0 4.5px;
      border-style: solid;
      border-color: rgba(15, 23, 42, 0.88) transparent transparent transparent;
    }

    .stack-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.8), inset 0 1.5px 2px rgba(255, 255, 255, 0.7);
      border: 1.5px solid #000000;
      flex-shrink: 0;
      position: relative;
    }

    .stack-dot.Red {
      background: radial-gradient(circle at 35% 35%, #ff6b6b, #dc2626);
    }

    .stack-dot.Green {
      background: radial-gradient(circle at 35% 35%, #4ade80, #16a34a);
    }

    .stack-dot.Yellow {
      background: radial-gradient(circle at 35% 35%, #ffe066, #ca8a04);
      border: 1.5px solid #090d16; /* Strong dark outline to prevent color composition with yellow track tiles */
    }

    .stack-dot.Blue {
      background: radial-gradient(circle at 35% 35%, #60a5fa, #2563eb);
    }

    /* Mobile Responsive Breakpoints */
    @media (max-width: 640px) {
      header {
        padding: 0.5rem 0.75rem;
      }
      .logo {
        font-size: 1rem;
      }
      .turn-badge {
        padding: 0.25rem 0.6rem;
        font-size: 0.75rem;
      }
      .control-bar {
        bottom: 1rem;
        padding: 0.5rem 0.85rem;
        gap: 0.6rem;
        border-radius: 1rem;
      }
      .dice-box {
        width: 42px;
        height: 42px;
        font-size: 1.25rem;
      }
      .btn-roll {
        padding: 0.6rem 1.1rem;
        font-size: 0.9rem;
        min-height: 42px;
        min-width: 100px;
      }
      .action-log {
        display: none;
      }
      .menu-card {
        padding: 1.5rem;
        gap: 1.25rem;
      }
      .menu-title {
        font-size: 1.75rem;
      }
    }
  </style>
</head>
<body>
  <div id="loading-overlay">
    <div class="spinner"></div>
    <h3>Loading 3D Ludo Engine...</h3>
  </div>

  <!-- Opening Main Menu Overlay -->
  <div id="main-menu-overlay">
    <div class="menu-card">
      <div class="menu-header">
        <div class="menu-title">
          <span>🎲</span> Ludo Lady 3D
        </div>
        <div class="menu-subtitle">Create a room or join friends to play</div>
      </div>

      <!-- Navigation Tabs -->
      <div class="menu-tabs">
        <button class="tab-btn active" id="tab-create">✨ Create Room</button>
        <button class="tab-btn" id="tab-join">🚪 Join Room</button>
        <button class="tab-btn" id="tab-local">⚡ Quick Play</button>
      </div>

      <!-- Create Room Content -->
      <div class="tab-content active" id="content-create">
        <div class="form-group">
          <label class="form-label">Number of Players</label>
          <select id="menu-player-count">
            <option value="4" selected>4 Players (Red, Green, Yellow, Blue)</option>
            <option value="3">3 Players (Red, Green, Yellow)</option>
            <option value="2">2 Players (Red, Yellow)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label">Room Code (Share with friends)</label>
          <div class="code-display-box">
            <span class="code-text" id="generated-room-code">------</span>
            <button class="btn-copy" id="btn-copy-generated">📋 Copy</button>
          </div>
        </div>

        <button class="btn-primary-action" id="btn-start-created-room">
          🚀 Create & Start Room
        </button>
      </div>

      <!-- Join Room Content -->
      <div class="tab-content" id="content-join">
        <div class="form-group">
          <label class="form-label">Enter Room Code</label>
          <input type="text" id="menu-join-code-input" placeholder="e.g. 748291" maxlength="10">
        </div>

        <button class="btn-primary-action" id="btn-submit-join-room">
          🔗 Join Room & Play
        </button>
      </div>

      <!-- Quick Local Play Content -->
      <div class="tab-content" id="content-local">
        <div class="form-group">
          <label class="form-label">Pass & Play Mode</label>
          <p style="font-size:0.85rem; color:var(--text-muted); line-height:1.4;">
            Play locally on the same device. Standard 4-player Ludo rules.
          </p>
        </div>

        <button class="btn-primary-action" id="btn-start-local-game">
          🎮 Start Local Match
        </button>
      </div>

    </div>
  </div>

  <!-- In-Game Header Bar -->
  <header>
    <div class="logo" id="header-logo">
      <span>🎲</span> Ludo Lady 3D
    </div>

    <div class="turn-badge" id="turn-badge">Red's Turn</div>

    <div class="room-panel">
      <div class="room-info-pill" id="room-info-pill">
        <span>Room:</span> <strong id="header-room-code">Local</strong>
      </div>
      <button class="btn-secondary-action" id="btn-open-menu" style="padding:0.35rem 0.75rem; font-size:0.8rem;">
        ⚙️ Menu
      </button>
    </div>
  </header>

  <!-- 3D Canvas Viewport Container -->
  <div id="canvas-container">
    <div id="stack-overlay-container"></div>
  </div>

  <!-- Control Bar -->
  <div class="control-bar">
    <div class="dice-box" id="dice-value">🎲</div>
    <button class="btn-roll" id="btn-roll">ROLL DICE</button>
    <div class="action-log" id="action-log">Game initialized</div>
  </div>

  <!-- Winner Modal -->
  <div class="modal" id="winner-modal">
    <div class="modal-card">
      <h2 id="winner-text">🎉 PLAYER WON!</h2>
      <button id="btn-winner-re-open-menu" style="background:#38bdf8; color:#0f172a; border:none; padding:0.75rem 2rem; border-radius:0.75rem; font-size:1.1rem; font-weight:800; cursor:pointer;">
        Main Menu
      </button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
